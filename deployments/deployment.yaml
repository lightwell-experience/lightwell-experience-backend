# https://redhatinsights.github.io/clowder/clowder/dev/api_reference.html
---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: lightwell-experience-backend
objects:
  - apiVersion: cloud.redhat.com/v1alpha1
    kind: ClowdApp
    metadata:
      name: lightwell-experience-backend
    spec:
      envName: ${ENV_NAME}
      deployments:
        - name: service
          webServices:
            public:
              enabled: true
              apiPath: lightwell-next
          podSpec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
            image: ${IMAGE}:${IMAGE_TAG}
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /ping
                port: 8000
                scheme: HTTP
              initialDelaySeconds: 35
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 120
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /ping
                port: 8000
                scheme: HTTP
              initialDelaySeconds: 35
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 120

  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: lightwell-experience-backend
      name: lightwell-experience-backend
    spec:
      ports:
        - name: 8000-tcp
          port: 8000
          protocol: TCP
          targetPort: 8000
        - name: metrics
          port: 9000
          protocol: TCP
          targetPort: 9000
      selector:
        pod: lightwell-experience-backend-service
      sessionAffinity: None
      type: ClusterIP

parameters:
  - name: ENV_NAME
    required: true
  - name: IMAGE
    required: true
  - name: IMAGE_TAG
    required: true
